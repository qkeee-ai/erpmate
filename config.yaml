model:
  default: deepseek/deepseek-v4.1-flash
  provider: openrouter
  base_url: https://openrouter.ai/api/v1
  api_mode: chat_completions
# fallback_providers: used when the primary (model.default) errors past
# api_max_retries. A different vendor on purpose, so an upstream outage
# doesn't take out both. PAID SKU: this is the user-facing turn lane, not
# background aux traffic, so auxiliary.free_only below does not apply.
fallback_providers:
  - provider: openrouter
    model: z-ai/glm-5.3-flash
# auxiliary: per-task model routing for background work (compression,
# classifiers, curator, etc.), kept off the main model lane.
# free_only: false — every block below runs on a paid SKU; true would
# reject any block whose model isn't a :free SKU, including one that
# inherited the (paid) main model via an unset provider/model pair — so a
# stray unset block fails loudly in the log instead of silently going dead.
# Model tiers: deepseek-v4.1-flash / glm-5.3-flash (1M ctx, tool-calling,
# many providers each) for compression/vision/mcp/goal_judge/curator-style
# work; nex-n2.5-mini (262K ctx, no tool calling, single provider) for
# simple classifiers and short plain-text generation, always paired with a
# glm-5.3-flash fallback_chain entry since it has no second provider of its
# own. Primary and fallback are always different vendors.
# `review` (the user-invoked /review subagent) is deliberately left on
# "auto" — not background traffic, worth main-model quality.
auxiliary:
  free_only: false
  # Auto-chain fallback for any block that cannot build its own client.
  openrouter_model: z-ai/glm-5.3-flash
  # Context compaction. A bad summary loses task state permanently, so this
  # gets the same model as the main lane, with a 1M-context fallback.
  compression:
    provider: openrouter
    model: deepseek/deepseek-v4.1-flash
    fallback_chain:
      - {provider: openrouter, model: z-ai/glm-5.3-flash}
  # Aux vision lane. MUST be vision-capable: the doc-extraction domain
  # (qkeee-erp-associate) reads invoice PDFs/images.
  vision:
    provider: openrouter
    model: z-ai/glm-5.3-flash
    fallback_chain:
      - {provider: openrouter, model: deepseek/deepseek-v4.1-flash}
  # Fast classifiers / short plain-text generations — none of these pass
  # tools to the model, so nex-n2.5-mini's missing tool support doesn't matter.
  # memory_query_rewrite has an 8s timeout; if nex-n2.5-mini's reasoning
  # makes it miss that, add `reasoning_effort: minimal` to that block.
  approval:
    provider: openrouter
    model: nex-agi/nex-n2.5-mini
    fallback_chain:
      - {provider: openrouter, model: z-ai/glm-5.3-flash}
  memory_query_rewrite:
    provider: openrouter
    model: nex-agi/nex-n2.5-mini
    fallback_chain:
      - {provider: openrouter, model: z-ai/glm-5.3-flash}
  title_generation:
    provider: openrouter
    model: nex-agi/nex-n2.5-mini
    fallback_chain:
      - {provider: openrouter, model: z-ai/glm-5.3-flash}
  monitor:
    provider: openrouter
    model: nex-agi/nex-n2.5-mini
    fallback_chain:
      - {provider: openrouter, model: z-ai/glm-5.3-flash}
  skills_hub:
    provider: openrouter
    model: nex-agi/nex-n2.5-mini
    fallback_chain:
      - {provider: openrouter, model: z-ai/glm-5.3-flash}
  # mcp is MCP sampling: Hermes forwards the server's tools on the call
  # (tools/mcp_tool_sampling.py), so it needs tool calling — not nex-mini.
  mcp:
    provider: openrouter
    model: z-ai/glm-5.3-flash
    fallback_chain:
      - {provider: openrouter, model: deepseek/deepseek-v4.1-flash}
  profile_describer:
    provider: openrouter
    model: nex-agi/nex-n2.5-mini
    fallback_chain:
      - {provider: openrouter, model: z-ai/glm-5.3-flash}
  # Longer reasoning / JSON-structure work. glm-5.3-flash is the cheaper of
  # the two 1M models and serves these low-frequency judgment calls.
  goal_judge:
    provider: openrouter
    model: z-ai/glm-5.3-flash
    fallback_chain:
      - {provider: openrouter, model: deepseek/deepseek-v4.1-flash}
  triage_specifier:
    provider: openrouter
    model: z-ai/glm-5.3-flash
    fallback_chain:
      - {provider: openrouter, model: deepseek/deepseek-v4.1-flash}
  kanban_decomposer:
    provider: openrouter
    model: z-ai/glm-5.3-flash
    fallback_chain:
      - {provider: openrouter, model: deepseek/deepseek-v4.1-flash}
  # curator/background_review call tools (skill_manage). background_review
  # runs after every turn, so it sits on the cheaper-input glm-5.3-flash.
  curator:
    provider: openrouter
    model: deepseek/deepseek-v4.1-flash
    fallback_chain:
      - {provider: openrouter, model: z-ai/glm-5.3-flash}
  background_review:
    provider: openrouter
    model: z-ai/glm-5.3-flash
    fallback_chain:
      - {provider: openrouter, model: deepseek/deepseek-v4.1-flash}
checkpoints:
  enabled: true
  max_snapshots: 20
  max_total_size_mb: 500
  max_file_size_mb: 10
  auto_prune: true
  retention_days: 7
  min_interval_hours: 24
agent:
  max_turns: 50
# external_dirs marks skills/qkeee-erp/ (the master qkeee-erp-* family,
# including qkeee-erp-associate) as externally owned: Hermes' autonomous
# background-review/curator pass treats it read-only and never auto-edits/
# patches/deletes it. A foreground, user-directed edit is unaffected.
# Relative path, resolved against this profile's own HERMES_HOME.
skills:
  external_dirs:
    - skills/qkeee-erp
  # write_approval: stages every skill write (create/edit/patch/delete, any
  # origin, including Hermes' own autonomous "offer to save as skill"
  # reflex) to <HERMES_HOME>/pending/skills/ for foreground review via
  # `/skills pending`, instead of committing straight to disk unreviewed.
  write_approval: true
  # disabled: trims the stock skill set to what this ERP/ops profile
  # actually uses — same motivation as platform_toolsets being trimmed
  # below (per-call schema cost), applied to skills instead of tools.
  disabled:
    - airtable
    - architecture-diagram
    - ascii-video
    - baoyu-infographic
    - claude-code
    - claude-design
    - codebase-inspection
    - codex
    - computer-use
    - design-md
    - dogfood
    - gif-search
    - github
    - hermes-agent-skill-authoring
    - humanizer
    - inspecting-hermes-desktop-dom
    - manim-video
    - maps
    - node-inspect-debugger
    - notion
    - obsidian
    - opencode
    - p5js
    - popular-web-designs
    - python-debugpy
    - requesting-code-review
    - sdlc-review
    - simplify-code
    - songsee
    - songwriting-and-ai-music
    - spike
    - systematic-debugging
    - teams-meeting-pipeline
    - test-driven-development
    - xurl
    - youtube-content
# consolidate: on, so the curator's periodic pass also runs its LLM
# umbrella-building pass (merging overlapping agent-created skills), not
# just the default deterministic inactivity prune.
curator:
  consolidate: true
  interval_hours: 24
  min_idle_hours: 2
web:
  backend: tavily
  use_gateway: false
browser:
  cloud_provider: local
  use_gateway: false
display:
  tool_progress: all
dashboard:
  basic_auth:
    username: ""
    password_hash: ""
    secret: ""
tts:
  use_gateway: false
# command_allowlist: literal command patterns/globs (e.g. "rm", "git push
# *") pre-approved past the dangerous-command approval gate. The entries
# below are prose, not patterns, so they do not match anything. ERPNext
# writes run only through the qkeee-erp plugin's erp_execute_write tool
# (its own confirmation-token gate), never through a terminal command.
command_allowlist:
  - delete in root path
  - script execution via -e/-c flag
  - script execution via heredoc
onboarding:
  seen:
    tool_progress_prompt: true
    busy_input_prompt: true
    profile_build_offered: true
# Schema version. Bump only via `hermes config migrate`.
_config_version: 45
# threshold: lowered from the 0.50 default so auto-compaction fires
# earlier, capping worst-case per-turn input cost at the price of more
# frequent summarization calls.
compression:
  threshold: 0.30
session_reset:
  mode: both
  idle_minutes: 1440
  at_hour: 4
image_gen:
  provider: openrouter
  use_gateway: false
  model: openai/gpt-5.4-image-2
# platform_toolsets: every enabled toolset's schema is sent as input on
# every API call regardless of use, so each platform list below is trimmed
# to what it actually needs. browser/computer_use/image_gen/tts are
# dropped everywhere — this profile never drives a browser, controls a
# desktop, generates images, or does TTS. vision is kept everywhere — the
# doc-extraction domain (qkeee-erp-associate) reads invoice PDFs/images.
platform_toolsets:
  # qkeee_erp tools need a gateway sender; in an interactive CLI session
  # they refuse, so an operator uses the skill scripts with
  # --requested-by instead. connections is present on every list below.
  cli:
    - clarify
    - code_execution
    - connections
    - cronjob
    - delegation
    - file
    - kanban
    - memory
    - qkeee_erp
    - session_search
    - skills
    - terminal
    - todo
    - vision
    - web
  # code_execution is deliberately absent from google_chat/email: no ERP
  # skill needs it, and an execute_code script could read the ERPNext
  # credentials and call ERPNext directly, bypassing the connector's gate.
  # ERPNext is reached only through the qkeee_erp gateway tools below.
  google_chat:
    - clarify
    - connections
    - cronjob
    - delegation
    - file
    - kanban
    - memory
    - qkeee_erp
    - session_search
    - skills
    - terminal
    - todo
    - vision
    - web
  # email: same list as google_chat.
  email:
    - clarify
    - connections
    - cronjob
    - delegation
    - file
    - kanban
    - memory
    - qkeee_erp
    - session_search
    - skills
    - terminal
    - todo
    - vision
    - web
# toolsets: Hermes' default plus `kanban`. The kanban tools (kanban_create,
# kanban_show, kanban_list, ...) only appear when `kanban` is named both
# here and in the active platform's platform_toolsets list above.
# kanban.orchestrator_profile/default_assignee below name the Profile
# Kanban dispatches to.
toolsets:
  - hermes-cli
  - kanban
# TARGET-PROFILE: orchestrator_profile/default_assignee must name the
# Profile this file is deployed as, not dev-erp literally.
kanban:
  orchestrator_profile: dev-erp  # TARGET-PROFILE: set to this profile's name
  default_assignee: dev-erp  # TARGET-PROFILE: set to this profile's name
  auto_decompose: false
context:
  engine: lcm
# A plugin toolset is ON for a platform unless it is "known" here and
# absent from that platform's list. On a platform not listed here (email,
# slack, ...) it is on, and its tools refuse every turn whose sender
# doesn't match that platform's identity check.
known_plugin_toolsets:
  cli:
    - spotify
    - qkeee_erp
  discord:
    - spotify
    - qkeee_erp
  google_chat:
    - qkeee_erp
# discord disabled: ERPNext access requires an identity check this platform
# cannot satisfy (a Discord id is not an ERPNext user).
platforms:
  discord:
    enabled: false
  google_chat:
    enabled: true
# TARGET-PROFILE: qkeee-erp.settings.active_env must name the ERP
# environment this deployment actually talks to.
plugins:
  enabled:
    - hermes-handoff
    - hermes-jev
    - hermes-lcm
    - qkeee-erp
  disabled: []
  entries:
    hermes-handoff:
      allow_tool_override: false
    hermes-jev:
      allow_tool_override: true
    hermes-lcm:
      allow_tool_override: false
    qkeee-erp:
      allow_tool_override: false
      settings:
        active_env: demo_erp  # TARGET-PROFILE: set to this deployment's ERP env
        mode: read-write
# cwd (/opt/cwd) is the in-container mount point, not a machine-local
# path — portable across installs (docker-compose binds HERMES_CWD there).
# Never put a host/dev-machine path here (this file is distribution_owned).
# backend ssh: terminal/file/execute_code run in the compose `terminal`
# sidecar, which mounts /opt/cwd but never /opt/data, so the agent can't
# read ERPNext credentials or other gateway secrets via a terminal
# command. No sidecar in your deployment? Set backend back to local (the
# agent can then read /opt/data). Values here override TERMINAL_* env vars.
terminal:
  backend: ssh
  cwd: /opt/cwd
  ssh_host: terminal
  ssh_user: hermes
  ssh_port: 22
  ssh_key: /opt/data/.terminal-ssh/id_ed25519
approvals:
  destructive_slash_confirm: true
updates:
  pre_update_backup: true
  backup_keep: 5
  non_interactive_local_changes: stash

# redact_secrets: masks strings that look like API keys/tokens/passwords
# in tool output, logs, and chat responses before the model or user sees
# them. tirith_*: pre-exec command scanning (also configurable via
# TIRITH_ENABLED/TIRITH_BIN/TIRITH_TIMEOUT/TIRITH_FAIL_OPEN env vars).
security:
  redact_secrets: true
  tirith_enabled: true
  tirith_path: "tirith"
  tirith_timeout: 5
  tirith_fail_open: true

