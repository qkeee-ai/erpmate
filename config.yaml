model:
  default: deepseek/deepseek-v4.1-flash
  provider: openrouter
  base_url: https://openrouter.ai/api/v1
  api_mode: chat_completions
# fallback_providers: added 2026-10-07. Empty by default, so one provider
# error (overload/429/5xx) past api_max_retries ended the turn outright.
# A different vendor from model.default on purpose — a fallback that shares
# the primary's upstream fails with it. Picked from jev routing.json's
# medium/general pool (catalog-validated). PAID SKU: this lane is the
# user-facing turn, not background aux traffic, so free_only does not apply.
fallback_providers:
  - provider: openrouter
    model: z-ai/glm-5.3-flash
# auxiliary: added 2026-09-03 during the token-usage review. Two problems
# observed in gateway logs:
#   1. "Auxiliary client: PAID lane engaged..." WARNING fires on every
#      non-:free OpenRouter fallback — free_only forces the fallback lane
#      to stay on :free SKUs (or skip it) instead of silently spending.
#   2. background_review (the post-turn "review conversation, update skill
#      library" self-improvement pass) was running on the MAIN model
#      (nex-agi/nex-n2-mini) every single turn, including trivial ones —
#      93K/79K input tokens per run in observed logs, one landing
#      result=none. Routing it to a dedicated free model keeps the
#      self-improvement mechanism (now safer anyway per skills.write_
#      approval + curator.consolidate below) without paying main-model
#      rates for it on every turn.
#
# 2026-10-05 follow-up: free_only was silently killing the ENTIRE auxiliary
# lane, not just the fallback. Every auxiliary task block defaults to
# provider: "auto", model: "" — which means "inherit the main model", i.e.
# openrouter/auto-beta (a PAID SKU). _resolve_openrouter_branch() passes that
# inherited model into _try_openrouter(), where free_only rejects anything not
# ending in ":free", so each block was skipped before any credential check:
#
#   auxiliary.free_only is enabled but the OpenRouter fallback model
#   'openrouter/auto-beta' is not a :free SKU — skipping the OpenRouter fallback
#   resolve_provider_client: nous requested but Nous Portal not configured
#
# With the Nous lane unauthenticated too, that left NOTHING: compression never
# ran (so compression.threshold: 0.30 below was dead config and per-turn input
# cost grew unbounded — the exact problem this file was tuned to fix),
# background_review never ran, the curator never ran. Only background_review
# carried an explicit model, which is why only it was ever going to work.
#
# Fix: name a :free model on every block that actually fires here. free_only
# stays true deliberately — it is the guard that makes a block we forgot fail
# loudly in the log instead of quietly billing main-model rates. Model ids
# verified against `jev models list` (322-model OpenRouter catalog, 2026-10-05):
#   nemotron-3.5-lightning:free   1M ctx, no vision — fast/cheap classifiers
#   nemotron-3-ultra-550b:free    1M ctx, no vision — summarisation, reasoning
#   thinkingmachines/inkling:free 1M ctx, VISION    — the aux vision lane
#
# `review` is deliberately left on "auto": it is a user-invoked /review
# subagent, not background traffic, and is worth main-model quality.
#
# 2026-10-07: moved the whole auxiliary lane from :free to cheap PAID SKUs.
# The dev-erp gateway log showed the free tier failing two ways:
#   1. Every block sat on ONE upstream (NVIDIA's own free endpoint). One
#      "Upstream error from Nvidia: Service temporarily overloaded" took out
#      background_review, and compression was "blocked (attempts_exhausted)"
#      at ~117K tokens — the session grew unbounded again.
#   2. auxiliary.openrouter_model was unset, so the auto-chain's OpenRouter
#      step inherited the (paid) main model and free_only skipped it on every
#      turn — the repeating "'openrouter/auto-beta' is not a :free SKU" line.
# free_only is now FALSE: it rejects ANY non-:free model, explicitly
# configured ones included ("free_only rejected non-free model"), so it
# cannot coexist with a paid lane. Expect one "PAID lane engaged" WARNING
# per model per process — that is the intended signal now, not an error.
#
# Model choice (operator preference: cheap paid SKUs from DeepSeek V4.1
# Flash / Nex N2.5 Mini / GLM 5.3 Flash). Prices are OpenRouter USD per 1M
# tokens, input/output/cached-input, catalog + endpoint stats 2026-10-07:
#   deepseek/deepseek-v4.1-flash  $0.30/$1.20/$0.006  1M ctx  vision+tools  29 providers
#   z-ai/glm-5.3-flash            $0.15/$0.50/$0.030  1M ctx  vision+tools  33 providers
#   nex-agi/nex-n2.5-mini         $0.025/$0.10/$0.003 262K    vision, NO tool calling,
#                                                             ONE provider (Nex AGI)
# Reliability now comes from provider count: OpenRouter routes a paid SKU
# across every provider serving it, so one provider overloading no longer
# fails the call. nex-n2.5-mini has a single provider, so every block on it
# carries a fallback_chain. Primary and fallback are always different
# vendors (DeepSeek <-> Z.AI, Nex <-> Z.AI).
#
# Compression needs a 1M window now: model.default (deepseek-v4.1-flash) is
# 1M, so compression.threshold 0.30 fires at ~314K tokens. Only 1M models
# are on that block and its chain. Hermes also refuses a fallback_chain
# entry whose context is too small for the task (_context_too_small).
#
# Rejected: the paid twins of the old free SKUs — nemotron-3-ultra is only
# 262K paid (1M was free-only) at $0.50/$2.20; inkling $1.00/$4.05;
# inkling-small single-provider. z-ai/glm-5.2:free is gone from the catalog.
# nex-n2.5-pro showed 0% uptime on its only provider. Nothing newer than
# GLM 5.3 is listed; glm-5.3 (non-flash) is $7/1M output.
# Re-check prices/uptime with `jev models list` or
# https://openrouter.ai/api/v1/models/<id>/endpoints before changing.
auxiliary:
  free_only: false
  # Auto-chain fallback for any block that cannot build its own client.
  openrouter_model: z-ai/glm-5.3-flash
  # Context compaction. A bad summary loses task state permanently, so this
  # gets the same model as the main lane, with a 1M-context fallback.
  compression:
    provider: openrouter
    model: deepseek/deepseek-v4.1-flash
    fallback_chain:
      - {provider: openrouter, model: z-ai/glm-5.3-flash}
  # Aux vision lane. MUST be vision-capable: the doc-extraction domain
  # (qkeee-erp-associate) reads invoice PDFs/images.
  vision:
    provider: openrouter
    model: z-ai/glm-5.3-flash
    fallback_chain:
      - {provider: openrouter, model: deepseek/deepseek-v4.1-flash}
  # Fast classifiers / short plain-text generations — none of these pass
  # tools to the model (checked in hermes-agent: approval_smart.py,
  # memory/query_rewrite.py, title_generator.py, classify_items.py,
  # profile_describer.py), so nex-n2.5-mini's missing tool support does not
  # matter.
  # memory_query_rewrite has an 8s timeout; if nex-n2.5-mini's reasoning
  # makes it miss that, add `reasoning_effort: minimal` to that block.
  approval:
    provider: openrouter
    model: nex-agi/nex-n2.5-mini
    fallback_chain:
      - {provider: openrouter, model: z-ai/glm-5.3-flash}
  memory_query_rewrite:
    provider: openrouter
    model: nex-agi/nex-n2.5-mini
    fallback_chain:
      - {provider: openrouter, model: z-ai/glm-5.3-flash}
  title_generation:
    provider: openrouter
    model: nex-agi/nex-n2.5-mini
    fallback_chain:
      - {provider: openrouter, model: z-ai/glm-5.3-flash}
  monitor:
    provider: openrouter
    model: nex-agi/nex-n2.5-mini
    fallback_chain:
      - {provider: openrouter, model: z-ai/glm-5.3-flash}
  skills_hub:
    provider: openrouter
    model: nex-agi/nex-n2.5-mini
    fallback_chain:
      - {provider: openrouter, model: z-ai/glm-5.3-flash}
  # mcp is MCP sampling: Hermes forwards the server's tools on the call
  # (tools/mcp_tool_sampling.py), so it needs tool calling — not nex-mini.
  mcp:
    provider: openrouter
    model: z-ai/glm-5.3-flash
    fallback_chain:
      - {provider: openrouter, model: deepseek/deepseek-v4.1-flash}
  profile_describer:
    provider: openrouter
    model: nex-agi/nex-n2.5-mini
    fallback_chain:
      - {provider: openrouter, model: z-ai/glm-5.3-flash}
  # Longer reasoning / JSON-structure work. glm-5.3-flash is the cheaper of
  # the two 1M models and serves these low-frequency judgment calls.
  goal_judge:
    provider: openrouter
    model: z-ai/glm-5.3-flash
    fallback_chain:
      - {provider: openrouter, model: deepseek/deepseek-v4.1-flash}
  triage_specifier:
    provider: openrouter
    model: z-ai/glm-5.3-flash
    fallback_chain:
      - {provider: openrouter, model: deepseek/deepseek-v4.1-flash}
  kanban_decomposer:
    provider: openrouter
    model: z-ai/glm-5.3-flash
    fallback_chain:
      - {provider: openrouter, model: deepseek/deepseek-v4.1-flash}
  # curator/background_review call tools (skill_manage) — both models below
  # support tool calling. background_review runs after EVERY turn (~90K
  # input observed), so it sits on the cheaper-input glm-5.3-flash.
  curator:
    provider: openrouter
    model: deepseek/deepseek-v4.1-flash
    fallback_chain:
      - {provider: openrouter, model: z-ai/glm-5.3-flash}
  background_review:
    provider: openrouter
    model: z-ai/glm-5.3-flash
    fallback_chain:
      - {provider: openrouter, model: deepseek/deepseek-v4.1-flash}
checkpoints:
  enabled: true
  max_snapshots: 20
  max_total_size_mb: 500
  max_file_size_mb: 10
  auto_prune: true
  retention_days: 7
  min_interval_hours: 24
agent:
  max_turns: 50
# skills.external_dirs marks skills/qkeee-erp/ (the master qkeee-erp-*
# family, including qkeee-erp-associate) as externally owned: Hermes'
# autonomous background-review/curator pass treats anything under an
# external dir as read-only and never autonomously edits/patches/deletes
# it (tools/skill_manager_tool.py's _background_review_write_guard, "external
# skills are read-only to the curator" — confirmed by direct inspection of
# hermes-agent during the qkeee-erp-associate consolidation, Phase 4).
# A foreground, user-directed edit is unaffected; only the autonomous pass
# is blocked. This entry was documented as already in place in README.md/
# profile.md but was missing from this file — added here rather than left
# as a doc/config mismatch. Relative path, resolved against this profile's
# own HERMES_HOME (this repo, via the symlinked live-profile mount — see
# README.md's "Live Hermes profile" note), never a machine-local absolute
# path.
skills:
  external_dirs:
    - skills/qkeee-erp
  # write_approval: documented in profile.md ("Local skill writes gated by
  # skills.write_approval, no unreviewed changes") but was never actually
  # set here — same doc/config mismatch pattern external_dirs had above,
  # caught during the invoice-processing/connector-governance duplicate-
  # skill review (2026-09-02). Without this key, tools/write_approval.py's
  # write_approval_enabled() defaults False and every skill_manage(create/
  # edit/patch/delete) — including Hermes' own autonomous "offer to save
  # as skill" reflex after a hard session — commits straight to disk,
  # unstaged, unreviewed. true stages every skill write (create/edit/
  # patch/delete, any origin) to <HERMES_HOME>/pending/skills/ for
  # foreground review via `/skills pending` instead of silent commit.
  write_approval: true
# curator.consolidate: OFF by default in agent/curator.py (DEFAULT_CONSOLIDATE).
# Off means the curator's periodic pass only does the deterministic
# inactivity prune (stale/archive) and never runs its LLM umbrella-building
# pass that merges overlapping skills — the mechanism that should have
# caught erpnext-invoice-processing and erpnext-connector-governance
# duplicating qkeee-erp-associate's own references/00-conventions.md and
# domains/accounts.md content. Turned on here so overlapping agent-created
# skills actually get merged/absorbed instead of accumulating.
curator:
  consolidate: true
  interval_hours: 24
  min_idle_hours: 2
web:
  backend: tavily
  use_gateway: false
browser:
  cloud_provider: local
  use_gateway: false
display:
  tool_progress: all
dashboard:
  basic_auth:
    username: ""
    password_hash: ""
    secret: ""
tts:
  use_gateway: false
# command_allowlist intentionally empty. Hermes's actual schema (see
# website/docs/user-guide/security.md "Permanent Allowlist") expects
# literal command patterns/globs here (e.g. "rm", "git push *") that get
# silently pre-approved past the dangerous-command approval gate. This
# used to hold "execute_code" / "script execution via heredoc" / "script
# execution via -e/-c flag" — descriptive prose, not command patterns,
# so those entries never matched anything and were dead config. Removed
# 2026-08-23 (adversarial-review follow-up) rather than left in place,
# since a stray real pattern added here later next to bogus-looking
# entries could plausibly go unnoticed on review. Every
# `python .../scripts/execute_write.py ...` invocation should go through
# Hermes's normal dangerous-command approval flow, on top of (not
# instead of) this library's own advisory-first/confirmation-token gate.
command_allowlist: []
onboarding:
  seen:
    tool_progress_prompt: true
    busy_input_prompt: true
    profile_build_offered: true
# 33 -> 41 (2026-10-05). The schema default is 41; shipping 33 meant
# migrate_config() ran the 34..41 ladder and then, because current_ver <
# latest_ver, called _persist_migration() -> save_config() -> atomic_yaml_write()
# — a PyYAML dump that REWRITES this file and destroys every comment in it. This
# file is distribution_owned, so that happened again after every install/update.
#
# Every step in that ladder is a no-op here, checked individually against this
# file and SOUL.md: 34 needs display.personality / agent.system_prompt (neither
# set), 35 needs display.background_process_notifications: all (display sets only
# tool_progress), 36 and 37 need a delegation block (absent), 38 needs
# plugins.enabled (absent), 39 needs a 'bfl' entry in platform_toolsets (absent),
# 40 needs model_catalog.ttl_hours (absent), 41 needs the "## Messaging other
# agents" heading in SOUL.md (absent). So the ladder changed nothing and the
# rewrite was pure comment loss.
#
# Re-verify these preconditions before bumping again — a step that WOULD apply
# must be allowed to run, or applied by hand here.
_config_version: 41
# compression.threshold: default 0.50 (agent/context_compressor.py). The
# nex-agi/nex-n2-mini context window is large enough that a single turn's
# accumulated tool-call history rarely crosses 50% before the turn ends —
# so auto-compaction never fires, and every extra round-trip within a turn
# resends the full growing context (observed: one turn climbed 42K->147K
# input tokens across 18 API calls). Lowered to trigger compaction sooner,
# capping worst-case per-turn input cost at the price of more frequent
# summarization calls.
compression:
  threshold: 0.30
session_reset:
  mode: both
  idle_minutes: 1440
  at_hour: 4
image_gen:
  provider: openrouter
  use_gateway: false
  model: openai/gpt-5.4-image-2
# platform_toolsets: trimmed 2026-09-03 from the stock full set. Every
# enabled toolset's tool schema is sent as input on every single API call
# regardless of use — confirmed as a fixed per-call cost multiplier during
# the token-usage review (input-heavy Hermes Agent rows, 300K+ tok on some
# calls). browser/computer_use/image_gen/tts dropped — this profile never
# drives a browser, controls a desktop, generates images, or does TTS.
# vision kept deliberately — the doc-extraction domain
# (qkeee-erp-associate) reads invoice PDFs/images and needs it.
platform_toolsets:
  # qkeee_erp (plugins/qkeee-erp): the ERPNext tools. On cli because Kanban
  # workers run with the profile's cli toolsets (hermes_cli/
  # kanban_db_dispatch.py, _resolve_worker_cli_toolsets); in an interactive
  # CLI session the tools refuse (no gateway sender), and an operator uses
  # the skill scripts with --requested-by instead.
  cli:
    - clarify
    - code_execution
    - cronjob
    - delegation
    - file
    - memory
    - qkeee_erp
    - session_search
    - skills
    - terminal
    - todo
    - vision
    - web
  discord:
    - clarify
    - code_execution
    - cronjob
    - delegation
    - file
    - memory
    - session_search
    - skills
    - terminal
    - todo
    - vision
    - web
  # google_chat added 2026-10-07: it was missing, so the platform this
  # profile actually serves fell back to the FULL stock toolset — every
  # browser/computer_use/feishu/spotify/... schema rode along on each call
  # (visible as ~20 "check_fn ... returned False" lines per turn). Same list
  # as cli/discord.
  # code_execution removed 2026-10-08 (requester identity binding, issue 02):
  # no ERP skill needs it, and an execute_code script could read the ERPNext
  # credentials and call ERPNext without the connector's gate. qkeee_erp
  # added (issue 04): ERPNext is reached only through those gateway tools.
  google_chat:
    - clarify
    - cronjob
    - delegation
    - file
    - memory
    - qkeee_erp
    - session_search
    - skills
    - terminal
    - todo
    - vision
    - web
# A plugin toolset is ON for a platform unless it is "known" here and absent
# from that platform's list (hermes_cli/tools_config.py,
# _enabled_plugin_toolsets). qkeee_erp is known for cli, discord and
# google_chat, so it is off on discord (a Discord id is not an ERPNext user).
# On a platform not listed here (email, slack, ...) it is on, and its tools
# refuse every turn whose sender is not an email.
known_plugin_toolsets:
  cli:
    - qkeee_erp
    - spotify
  discord:
    - qkeee_erp
    - spotify
  google_chat:
    - qkeee_erp
platforms:
  discord:
    enabled: true
  google_chat:
    enabled: true
# `terminal.cwd: /opt/cwd` is the in-container mount point, not a
# machine-local path, so it is portable across installs of this image:
# docker-compose.yaml bind-mounts the host dir there (HERMES_CWD, default
# /opt/cwd), exports TERMINAL_CWD to match, and cont-init.d/0155-cwd-setup
# chowns it so the terminal tool can write in it. Never put a host/dev-
# machine path here (this file is `distribution_owned`) — Hermes' "Never use
# machine-local paths" rule. If HERMES_CWD is overridden in compose, change
# this value with it. (Merged 2026-10-07: a second top-level `terminal:` key
# had been added above, and YAML's last-key-wins silently dropped its cwd.)
#
# backend ssh (2026-10-08, requester identity binding issue 06, agents ADR
# 0002): the terminal, file tools and execute_code run in the compose
# `terminal` sidecar, which mounts /opt/cwd but never /opt/data, so the agent
# cannot read the ERPNext credentials or any other gateway secret. ssh_host
# is the compose service name; 0157-terminal-ssh creates ssh_key and
# publishes its public key to the sidecar. No sidecar in your deployment?
# Set backend back to local (and accept that the agent can read /opt/data).
# Values here override TERMINAL_* env vars (gateway/run.py bridges them).
terminal:
  backend: ssh
  cwd: /opt/cwd
  ssh_host: terminal
  ssh_user: hermes
  ssh_port: 22
  ssh_key: /opt/data/.terminal-ssh/id_ed25519
approvals:
  destructive_slash_confirm: true
updates:
  pre_update_backup: true
  backup_keep: 5
  non_interactive_local_changes: stash

# ── Security ──────────────────────────────────────────────────────────
# Secret redaction is ON by default — strings that look like API keys,
# tokens, and passwords are masked in tool output, logs, and chat
# responses before the model or user ever sees them. Set redact_secrets
# to false to disable (e.g. when developing the redactor itself).
# tirith pre-exec scanning is enabled by default when the tirith binary
# is available. Configure via security.tirith_* keys or env vars
# (TIRITH_ENABLED, TIRITH_BIN, TIRITH_TIMEOUT, TIRITH_FAIL_OPEN).
#
security:
  redact_secrets: true
  tirith_enabled: true
  tirith_path: "tirith"
  tirith_timeout: 5
  tirith_fail_open: true

