services:
  hermes:
    build:
      context: .
      args:
        JEV_REF: ${JEV_REF:-main}
        LCM_REF: ${LCM_REF:-main}
    image: qkeee/erpnext-hermes:latest
    container_name: dvs-hermes
    restart: unless-stopped
    command: gateway run
    ports:
      - "8611:8642"
      - "8612:8643"
      - "9111:9119"
    volumes:
      # Local-clone mode: mount the repo and set HERMES_PROFILE_LOCAL_PATH to the
      # in-container path (must contain distribution.yaml at its root):
      # - ./:/opt/profile-src:ro
      # - ~/.hermes:/work/storage/hermes/agent-profiles/dvs-prod-erp/hermes-home
      # - /work/storage/hermes/agent-profiles/<custom-profile-name>/hermes-home:/opt/data
      # - /work/storage/hermes/agent-profiles/<custom-profile-name>/cwd:/tmp/<custom-profile-name>-cwd
    networks:
      - hermes-net
    environment:
      - HERMES_DASHBOARD=1
      # Profile distribution installed on first boot. Source, first match wins:
      #   1. HERMES_PROFILE_LOCAL_PATH: local clone (mount it, see volumes)
      #   2. HERMES_PROFILE_SOURCE: git URL (empty = skip install)
      - HERMES_PROFILE_NAME=${HERMES_PROFILE_NAME:-qk-prod-erp}
      - HERMES_PROFILE_SOURCE=${HERMES_PROFILE_SOURCE-https://github.com/qkeee-ai/erpmate.git}
      - HERMES_PROFILE_LOCAL_PATH=${HERMES_PROFILE_LOCAL_PATH:-}
      # Private repo auth (put the values in .env, not here):
      - HERMES_PROFILE_GIT_TOKEN=${HERMES_PROFILE_GIT_TOKEN:-}
      # - HERMES_PROFILE_GIT_TOKEN_FILE=/run/secrets/gh_token   # docker secret
      # - HERMES_PROFILE_SSH_KEY_FILE=/run/secrets/deploy_key   # git@github.com:... source
      # - HERMES_PROFILE_AUTO_UPDATE=1   # `hermes profile update` on every boot
      # Set to 0 to skip enabling hermes-lcm (context.engine=lcm) at boot:
      # - HERMES_LCM_ENABLE=0
      # Uncomment to forward specific env vars instead of using .env file:
      # - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY}
      # - OPENAI_API_KEY=${OPENAI_API_KEY}
      # - HERMES_DASHBOARD_BASIC_AUTH_USERNAME=${HERMES_DASHBOARD_BASIC_AUTH_USERNAME}
      # - HERMES_DASHBOARD_BASIC_AUTH_PASSWORD=${HERMES_DASHBOARD_BASIC_AUTH_PASSWORD}
      # - TELEGRAM_BOT_TOKEN=${TELEGRAM_BOT_TOKEN}
    deploy:
      resources:
        limits:
          memory: 4G
          cpus: "2.0"
  #my-tool:
  #  image: example/my-tool:latest
  #  container_name: my-tool
  #  restart: unless-stopped
  #  networks:
  #    - hermes-net

networks:
  hermes-net:
    driver: bridge
