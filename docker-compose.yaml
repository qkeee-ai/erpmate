services:
  hermes:
    build:
      context: .
      args:
        JEV_REF: ${JEV_REF:-main}
        LCM_REF: ${LCM_REF:-main}
    image: qkeee/erpmate:latest
    # Precedence: HERMES_CONTAINER_NAME, else HERMES_PROFILE_NAME, else
    # COMPOSE_PROJECT_NAME (compose's own default: this folder's name).
    # Nested ${:-} defaults are resolved by compose itself, no shell needed.
    container_name: ${HERMES_CONTAINER_NAME:-${HERMES_PROFILE_NAME:-${COMPOSE_PROJECT_NAME}}}
    restart: unless-stopped
    command: gateway run
    # No host port pinned: Docker allocates a free ephemeral host port per
    # container, so multiple agent containers on the same host never clash on
    # startup. Look up the assigned port with:
    #   docker compose port hermes 8642   (or 8643 / 9119)
    #   docker ps --filter name=<container> --format '{{.Ports}}'
    # Need a stable port instead (e.g. behind a reverse proxy)? Pin it back:
    #   - "8611:8642"
    ports:
      - "8642"
      - "8643"
      - "9119"
    volumes:
      # Host paths come from .env so one compose file serves many agent
      # profiles. Defaults keep both under ./data/ beside this file, so a bare
      # `docker compose up` works with no .env at all.
      #   HERMES_DATA_DIR -> $HERMES_HOME: profiles, sessions, skills, config
      #   HERMES_CWD_DIR  -> $HERMES_CWD:  the agent's working directory
      #                                    (exported as TERMINAL_CWD below)
      # Per-profile layout, e.g.:
      #   HERMES_DATA_DIR=/work/storage/hermes/agent-profiles/dev-erp/hermes-home
      #   HERMES_CWD_DIR=/work/storage/hermes/agent-profiles/dev-erp/cwd
      - ${HERMES_DATA_DIR:-./data/hermes-home}:/opt/data
      - ${HERMES_CWD_DIR:-./data/cwd}:${HERMES_CWD:-/opt/cwd}
      # Local-clone mode: mount the repo and set HERMES_PROFILE_LOCAL_PATH to the
      # in-container path, e.g. /opt/erpmate (must contain distribution.yaml at its root):
      # - ./:/opt/erpmate:ro
    networks:
      - hermes-net
    environment:
      # Match the host owner of the bind mounts above, else everything the
      # container writes there is owned by uid 10000. 0155-cwd-setup warns when
      # the cwd mount ends up unwritable because these don't line up.
      - HERMES_UID=${HERMES_UID:-10000}
      - HERMES_GID=${HERMES_GID:-10000}
      # In-container mount point of HERMES_CWD_DIR. TERMINAL_CWD is what the
      # terminal tool actually reads (config `terminal.cwd` is deliberately
      # unset in config.yaml); HERMES_CWD exists so 0155-cwd-setup can prepare
      # the same path and the volume line above can reference it.
      - HERMES_CWD=${HERMES_CWD:-/opt/cwd}
      - TERMINAL_CWD=${HERMES_CWD:-/opt/cwd}
      - HERMES_DASHBOARD=${HERMES_DASHBOARD:-1}
      # Dashboard auth. The s6 dashboard service binds 0.0.0.0, and a
      # non-loopback bind ALWAYS requires a registered auth provider — without
      # one the service exits and s6 restarts it, repeating the refusal
      # forever. These env vars outrank config.yaml and, unlike config.yaml,
      # are read regardless of which profile the dashboard resolves (it runs
      # against /opt/data, NOT the custom profile). Set username + either
      # password or password_hash; see 0196-dashboard-auth.
      - HERMES_DASHBOARD_HOST=${HERMES_DASHBOARD_HOST:-0.0.0.0}
      - HERMES_DASHBOARD_PORT=${HERMES_DASHBOARD_PORT:-9119}
      - HERMES_DASHBOARD_BASIC_AUTH_USERNAME=${HERMES_DASHBOARD_BASIC_AUTH_USERNAME:-}
      - HERMES_DASHBOARD_BASIC_AUTH_PASSWORD=${HERMES_DASHBOARD_BASIC_AUTH_PASSWORD:-}
      - HERMES_DASHBOARD_BASIC_AUTH_PASSWORD_HASH=${HERMES_DASHBOARD_BASIC_AUTH_PASSWORD_HASH:-}
      # Empty = 0196-dashboard-auth generates one and persists it on the volume
      # (sessions then survive a dashboard restart).
      - HERMES_DASHBOARD_BASIC_AUTH_SECRET=${HERMES_DASHBOARD_BASIC_AUTH_SECRET:-}
      - HERMES_DASHBOARD_OAUTH_CLIENT_ID=${HERMES_DASHBOARD_OAUTH_CLIENT_ID:-}
      # Behind a reverse proxy: the external URL. A non-loopback value here
      # engages the auth gate even on a 127.0.0.1 bind.
      - HERMES_DASHBOARD_PUBLIC_URL=${HERMES_DASHBOARD_PUBLIC_URL:-}
      # 0 = don't auto-disable an unauthenticated non-loopback dashboard
      # (keeps the crash-loop and its repeating refusal visible).
      - HERMES_DASHBOARD_AUTOGUARD=${HERMES_DASHBOARD_AUTOGUARD:-1}
      - HERMES_DASHBOARD_MIRROR=${HERMES_DASHBOARD_MIRROR:-1}
      # Profile distribution installed on first boot. Source, first match wins:
      #   1. HERMES_PROFILE_LOCAL_PATH: local clone (mount it, see volumes)
      #   2. HERMES_PROFILE_SOURCE: git URL (empty = skip install)
      # Profile name. Empty = the source's folder/repo name (erpmate for the URL
      # below; for local mode, the last segment of HERMES_PROFILE_LOCAL_PATH).
      - HERMES_PROFILE_NAME=${HERMES_PROFILE_NAME:-}
      - HERMES_PROFILE_SOURCE=${HERMES_PROFILE_SOURCE-https://github.com/qkeee-ai/erpmate.git}
      - HERMES_PROFILE_LOCAL_PATH=${HERMES_PROFILE_LOCAL_PATH:-}
      # Private repo auth (put the values in .env, not here):
      - HERMES_PROFILE_GIT_TOKEN=${HERMES_PROFILE_GIT_TOKEN:-}
      - HERMES_PROFILE_GIT_TOKEN_FILE=${HERMES_PROFILE_GIT_TOKEN_FILE:-}   # e.g. /run/secrets/gh_token
      - HERMES_PROFILE_SSH_KEY_FILE=${HERMES_PROFILE_SSH_KEY_FILE:-}   # for git@github.com:... sources
      - HERMES_PROFILE_AUTO_UPDATE=${HERMES_PROFILE_AUTO_UPDATE:-0}   # 1 = `hermes profile update` every boot
      # jev first-boot init (models suggest --write, doctor, /jev routing).
      # Routing is only enabled once the key is present (doctor passes).
      - TYPESAFE_API_KEY=${TYPESAFE_API_KEY:-}
      - JEV_ROUTING_MODE=${JEV_ROUTING_MODE:-on}   # on | shadow | off
      # Seed routing.json from a host file instead of the baked default
      # (mount it, then point at the in-container path; never overwrites):
      - JEV_ROUTING_FILE=${JEV_ROUTING_FILE:-}   # e.g. /opt/routing.json + volume ./routing.json:/opt/routing.json:ro
      - JEV_INIT_PROFILES=${JEV_INIT_PROFILES:-}   # space-separated; empty = the installed profile
      - JEV_INIT_ENABLE=${JEV_INIT_ENABLE:-1}   # 0 = skip jev init
      # 0 = skip enabling hermes-lcm (context.engine=lcm) at boot:
      - HERMES_LCM_ENABLE=${HERMES_LCM_ENABLE:-1}
      # First boot only: mark the custom profile desired_state=running and
      # default desired_state=stopped, so 02-reconcile-profiles starts the
      # custom one instead of default. Runs once; later boots / a manual
      # `hermes gateway start|stop` are left alone.
      - GATEWAY_PROMOTE_ENABLE=${GATEWAY_PROMOTE_ENABLE:-1}   # 0 = leave default running
      - GATEWAY_PROMOTE_PROFILE=${GATEWAY_PROMOTE_PROFILE:-}   # empty = the installed profile
      # Skill lockdown (0197-skills-lockdown). A new profile otherwise inherits
      # the base image's whole bundled skill library on top of the ~25 skills
      # this distribution ships. The hook writes the .no-bundled-skills marker,
      # deletes pristine bundled copies, and recomputes skills.disabled from
      # what is actually installed — every boot, so it survives
      # HERMES_PROFILE_AUTO_UPDATE=1 rewriting config.yaml.
      - HERMES_SKILLS_LOCKDOWN=${HERMES_SKILLS_LOCKDOWN:-1}   # 0 = keep all builtin skills
      - HERMES_SKILLS_LOCKDOWN_PROFILES=${HERMES_SKILLS_LOCKDOWN_PROFILES:-}   # empty = the installed profile
      - HERMES_SKILLS_LOCKDOWN_PRUNE=${HERMES_SKILLS_LOCKDOWN_PRUNE:-1}   # 0 = disable on disk, don't delete
      - HERMES_SKILLS_KEEP=${HERMES_SKILLS_KEEP:-}   # extra skill names to keep enabled
      # Uncomment to forward specific env vars instead of using .env file:
      # - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY}
      # - OPENAI_API_KEY=${OPENAI_API_KEY}
      # - TELEGRAM_BOT_TOKEN=${TELEGRAM_BOT_TOKEN}
    deploy:
      resources:
        limits:
          memory: 4G
          cpus: "2.0"
  #my-tool:
  #  image: example/my-tool:latest
  #  container_name: my-tool
  #  restart: unless-stopped
  #  networks:
  #    - hermes-net

networks:
  hermes-net:
    driver: bridge
