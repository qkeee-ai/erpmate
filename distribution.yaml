name: ERPNext Hermes Agent
version: 0.1.0
description: "Hermes Agent to manage one or more ERPNext instances. Runs a single consolidated qkeee-erp-associate skill covering HR/Payroll, Accounts, Taxation, Procurement, Sales, Inventory, Fixed Assets, MIS reporting, Manufacturing, Doc Extraction, and overall ERP system admin."
hermes_requires: ""
author: "Qkeee"
license: "MIT"
env_requires: []
# Hermes's default distribution_owned (when this key is omitted entirely) is
# SOUL.md, config.yaml, mcp.json, skills/, cron/, distribution.yaml. Listing
# this key at all replaces that default outright, so every path we still
# want owned has to be repeated here explicitly — mcp.json included below to
# match the default (it was previously narrowed out silently). profile.md is
# deliberately NOT listed: it ships with placeholder prose meant to be
# filled in per-install (see profile.md's "Config Summary" section) and is
# user-owned/customizable, not replaced on `profile update`.
distribution_owned:
  - SOUL.md
  # One entry per shipped skill (not skills/ itself): update replaces each
  # owned path with rmtree + copytree, so owning skills/ would delete every
  # skill the profile wrote itself, e.g. the Instance Notes in
  # skills/qkeee-erp-learned/. tests/test_distribution.py checks coverage.
  - skills/qkeee-erp
  - skills/productivity/DESCRIPTION.md
  - skills/productivity/box
  - skills/productivity/document-to-action-items
  - skills/productivity/docx
  - skills/productivity/google-workspace
  - skills/productivity/meeting-action-items
  - skills/productivity/nano-pdf
  - skills/productivity/ocr-and-documents
  - skills/productivity/pdf
  - skills/productivity/powerpoint
  - skills/productivity/product-price-monitor
  - skills/productivity/session-librarian
  - skills/productivity/weekly-review-planning
  - skills/productivity/xlsx
  - skills/research/DESCRIPTION.md
  - skills/research/arxiv
  - skills/research/blocked-page-recovery
  - skills/research/blogwatcher
  - skills/research/competitor-news-monitor
  - skills/research/grounded-citations
  - skills/research/llm-wiki
  - skills/research/research-paper-writing
  - skills/email/DESCRIPTION.md
  - skills/email/email-inbox-triage
  - skills/email/himalaya
  - cron/jobs.json
  - config.yaml
  - mcp.json
  - plugins/qkeee-erp   # gateway ERPNext tools + Kanban origin; enabled by cont-init 018-qkeee-erp-plugin
