name: CI

on:
  pull_request:
  push:
    branches: [develop, main]

jobs:
  tests:
    name: tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install test dependencies
        run: python -m pip install pytest pyyaml
      - name: Repo tests
        run: python -m pytest tests
      - name: Plugin tests
        run: python -m pytest plugins/qkeee-erp

  # Install and update this distribution with a real Hermes, pinned to a
  # release (agents .scratch/qkeee-erp-plugin-profile-split, issue 07):
  # Instance Notes survive an update, the plugin's Operator CLI loads.
  # Keep HERMES_AGENT_REF in step with the release the Docker base image
  # (nousresearch/hermes-agent) ships; it catches plugin API drift.
  distribution:
    name: distribution
    runs-on: ubuntu-latest
    env:
      HERMES_AGENT_REF: v2026.9.7
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install hermes-agent ${{ env.HERMES_AGENT_REF }}
        run: python -m pip install pytest pyyaml "hermes-agent @ git+https://github.com/nousresearch/hermes-agent@${HERMES_AGENT_REF}"
      - name: Install + update smoke
        run: python -m pytest tests/test_distribution_install.py -v
