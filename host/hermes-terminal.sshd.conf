# sshd drop-in for a Linux/macOS host install: the agent's terminal runs as
# the OS user `hermes-terminal`, reached by the gateway over ssh to localhost
# (agents ADR 0006; README "Host install (Linux/macOS)").
#
# Install as root:  /etc/ssh/sshd_config.d/10-hermes-terminal.conf
# (10-: sshd keeps the first value it reads per keyword, Match blocks
# included, so this must sort before 50-cloud-init.conf / 100-macos.conf.)
# Check:            sshd -t
#                   sshd -T -C user=hermes-terminal,host=localhost,addr=127.0.0.1
#
# The Docker sidecar's login and forwarding rules (docker/terminal/sshd_config),
# scoped to the terminal users so the host's other ssh users keep their
# settings: key login only, no forwarding of any kind. `hermes-terminal-*`
# covers a per-profile terminal user (one ERP-enabled profile per terminal
# user, setup item I2). The authorized_keys line adds
# `restrict,from="127.0.0.1,::1"`, so the key works only from this machine.
#
# Unlike the sidecar, AcceptEnv stays as the host has it (it cannot be set
# per Match; usually LANG LC_*): Hermes sends only passthrough variable
# names, and setup refuses a passthrough of the plugin's QKEEE_ERP_*
# variables.

Match User hermes-terminal,hermes-terminal-*
    AuthenticationMethods publickey
    PubkeyAuthentication yes
    PasswordAuthentication no
    KbdInteractiveAuthentication no
    AuthorizedKeysFile .ssh/authorized_keys

    AllowTcpForwarding no
    AllowStreamLocalForwarding no
    AllowAgentForwarding no
    X11Forwarding no
    PermitTunnel no
    GatewayPorts no
    PermitTTY no

    # The gateway multiplexes every terminal, file and execute_code call over
    # one ControlMaster connection; the default 10 sessions is too few.
    MaxSessions 64
    ClientAliveInterval 60
